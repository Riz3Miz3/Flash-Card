<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1020">
<title>فلش‌کارت من</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#080e1c;--panel:#111a2e;--panel2:#17223b;--line:#263653;--text:#f8fafc;--muted:#94a3b8;--accent:#fbbf24;--danger:#4a2029}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
h1{font-size:24px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;font-size:14px;cursor:pointer}
.primary{background:var(--accent);color:#111827}.secondary{background:#202c47;color:#fff}.danger{background:var(--danger);color:#fecdd3}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 16px 45px #0004}
input[type=file]{display:none}
#libraryEmpty{text-align:center;padding:40px 16px}.emptyIcon{font-size:50px;margin-bottom:8px}
.libraryHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.libraryHead h2{margin:0;font-size:20px}
.deckGrid{display:grid;grid-template-columns:1fr;gap:12px}
.deckCard{background:linear-gradient(145deg,#17223b,#111a2e);border:1px solid #293957;border-radius:20px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.deckCard:active{transform:scale(.99)}
.deckTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.deckTitle{font-size:18px;font-weight:850;line-height:1.45}.deckMeta{font-size:12px;color:var(--muted);margin-top:5px}
.ring{min-width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#202c47;font-size:12px;font-weight:800;border:4px solid #31415f}
.miniProgress{height:6px;background:#26324a;border-radius:99px;overflow:hidden;margin-top:14px}.miniProgress>div{height:100%;background:var(--accent)}
.cardActions{display:flex;gap:8px;margin-top:12px}.cardActions button{flex:1}
#studyView{display:none}.back{margin-bottom:12px}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;align-items:center;gap:10px}
select{width:100%;margin:10px 0;background:#202c47;color:#fff;border:1px solid #344562;border-radius:14px;padding:12px;font-size:15px}
.progress{height:7px;background:#26324a;border-radius:99px;overflow:hidden;margin:10px 0 16px}.progress div{height:100%;background:var(--accent)}
.studyCard{background:#fff;color:#111827;touch-action:pan-y;user-select:none;transition:transform .16s ease,opacity .16s ease;border-radius:24px;min-height:350px;padding:30px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.front{font-size:25px;line-height:1.8;white-space:pre-wrap}.answer{display:none;border-top:1px solid #ddd;margin-top:24px;padding-top:22px;width:100%;font-size:23px;line-height:1.7;direction:ltr;white-space:pre-wrap}
.audio{width:100%;margin-top:15px}.audio audio{width:100%}
.row{display:flex;gap:10px;margin-top:10px}.row .btn{flex:1}
.summary{display:flex;gap:8px;margin:8px 0}.pill{flex:1;background:#19243c;border-radius:12px;padding:8px;text-align:center;color:var(--muted);font-size:11px}.pill strong{display:block;color:#fff;font-size:16px}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);background:#17223b;border:1px solid #33425f;border-radius:14px;padding:11px 16px;display:none;z-index:99;max-width:90%;text-align:center}
#status{margin-top:12px;color:var(--muted);line-height:1.7}

/* v5.3 — iPhone full-screen study mode */
body.studying{overflow:hidden;height:100dvh}
body.studying .wrap{
  height:100dvh;
  max-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
body.studying header{display:none}
body.studying #studyView{
  display:flex!important;
  flex-direction:column;
  height:100%;
  min-height:0;
}
body.studying .back{
  flex:0 0 auto;
  margin:0 0 6px;
  padding:8px 11px;
  font-size:12px;
  border-radius:11px;
  align-self:flex-start;
}
body.studying #studyView>.panel{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:10px;
  border-radius:18px;
  overflow:hidden;
}
body.studying .stats{font-size:11px;min-height:18px}
body.studying select{
  flex:0 0 auto;
  margin:5px 0;
  padding:8px 10px;
  min-height:34px;
  border-radius:11px;
  font-size:13px;
}
body.studying .summary{margin:3px 0;gap:5px}
body.studying .pill{padding:5px 4px;font-size:9px;border-radius:9px}
body.studying .pill strong{font-size:13px}
body.studying .progress{height:5px;margin:4px 0 7px}
body.studying .studyCard{
  flex:1 1 auto;
  min-height:0;
  height:auto;
  padding:12px 12px;
  border-radius:18px;
  overflow:auto;
  overscroll-behavior:contain;
  touch-action:pan-y;
  -webkit-user-select:none;
  user-select:none;
  will-change:transform,opacity;
}
body.studying .front{font-size:clamp(18px,2.8vh,24px);line-height:1.55}
body.studying .answer{
  font-size:clamp(17px,2.5vh,22px);
  line-height:1.5;
  margin-top:12px;
  padding-top:12px;
}
body.studying .audio{margin-top:8px}
body.studying .audio audio{height:34px}
body.studying .row{flex:0 0 auto;gap:6px;margin-top:6px}
body.studying .row .btn{
  padding:8px 8px;
  border-radius:10px;
  font-size:12px;
  min-height:34px;
}
@media (max-height:700px){
  body.studying .summary{display:none}
  body.studying .front{font-size:18px}
  body.studying .answer{font-size:17px}
  body.studying .row .btn{min-height:31px;padding:6px 7px}
  body.studying .back{padding:6px 9px}
}

</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>فلش‌کارت‌های سمانه 🌸</h1><div class="sub">کتابخانه شخصی · v5.3</div></div>
 <label class="btn primary" for="file">＋ افزودن APKG</label>
 <input id="file" type="file">
</header>

<section id="libraryView" class="panel">
 <div class="libraryHead"><h2>کتابخانه</h2><span id="libraryCount" class="sub"></span></div>
 <div id="libraryEmpty">
   <div class="emptyIcon">📚</div><h2>هنوز فلش‌کارتی نداری</h2>
   <p class="sub">یک فایل APKG اضافه کن؛ بعداً هر تعداد مجموعه بخواهی می‌توانی نگه داری.</p>
   <label class="btn primary" for="file">انتخاب فایل APKG</label>
   <div id="status"></div>
 </div>
 <div id="deckGrid" class="deckGrid"></div>
</section>

<section id="studyView">
 <button id="back" class="btn secondary back">← کتابخانه</button>
 <div class="panel">
   <div class="stats"><span id="studyTitle"></span><b id="count"></b></div>
   <select id="lessonSelect"></select>
   <div class="summary">
    <div class="pill"><strong id="goodN">۰</strong>بلدم</div>
    <div class="pill"><strong id="againN">۰</strong>دوباره</div>
    <div class="pill"><strong id="unseenN">۰</strong>دیده‌نشده</div>
   </div>
   <div class="progress"><div id="bar"></div></div>
   <div class="studyCard">
    <div class="front" id="front"></div>
    <div class="answer" id="answer"></div>
    <div class="audio" id="audio"></div>
   </div>
   <div class="row navrow">
     <button id="nextCard" class="btn secondary">کارت بعدی ➡️</button>
     <button id="prevCard" class="btn secondary">⬅️ کارت قبلی</button>
   </div>
   <div class="row"><button id="show" class="btn secondary">نمایش جواب</button></div>
   <div class="row"><button id="again" class="btn secondary">دوباره</button><button id="good" class="btn primary">بلدم ✓</button></div>
 </div>
</section>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js"></script>
<script>
const $=s=>document.querySelector(s), td=new TextDecoder("utf-8");
const FD=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"], fa=n=>String(n).replace(/\d/g,d=>FD[+d]);
let current=null, zip=null, mediaMap={}, filtered=[], idx=0;
const clean=s=>(s||"").replace(/\[sound:[^\]]+\]/g,"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").trim();
const sounds=s=>[...(s||"").matchAll(/\[sound:([^\]]+)\]/g)].map(x=>x[1]);
const zstd=u=>u&&u[0]===0x28&&u[1]===0xB5&&u[2]===0x2F&&u[3]===0xFD?window.fzstd.decompress(u):u;
function rv(b,p){let v=0,s=0,x;do{x=b[p++];v+=(x&127)*2**s;s+=7}while(x&128);return[v,p]}
function skip(b,p,w){if(w===0)return rv(b,p)[1];if(w===1)return p+8;if(w===2){let r=rv(b,p);return r[1]+r[0]}if(w===5)return p+4;throw Error("protobuf")}
function entry(m){let p=0,n=null;while(p<m.length){let r=rv(m,p),t=r[0];p=r[1];let f=Math.floor(t/8),w=t%8;if(f===1&&w===2){let q=rv(m,p),l=q[0];p=q[1];n=td.decode(m.slice(p,p+l));p+=l}else p=skip(m,p,w)}return n}
function mediaIndex(raw){let b=zstd(raw);try{let t=td.decode(b).trim();if(t[0]==="{")return JSON.parse(t)}catch(e){}let p=0,a=[];while(p<b.length){let r=rv(b,p),t=r[0];p=r[1];let f=Math.floor(t/8),w=t%8;if(f===1&&w===2){let q=rv(b,p),l=q[0];p=q[1];let n=entry(b.slice(p,p+l));p+=l;if(n)a.push(n)}else p=skip(b,p,w)}let o={};a.forEach((n,i)=>o[i]=n);return o}
function mime(n){let e=(n.split(".").pop()||"").toLowerCase();return({mp3:"audio/mpeg",m4a:"audio/mp4",wav:"audio/wav",ogg:"audio/ogg",opus:"audio/ogg"})[e]||"application/octet-stream"}
function toast(t){$("#toast").textContent=t;$("#toast").style.display="block";setTimeout(()=>$("#toast").style.display="none",2200)}

const DB="flash-library-v5", STORE="kv";
function odb(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function get(k){let d=await odb();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function set(k,v){let d=await odb();return new Promise((ok,no)=>{let x=d.transaction(STORE,"readwrite");x.objectStore(STORE).put(v,k);x.oncomplete=ok;x.onerror=()=>no(x.error)})}
async function del(k){let d=await odb();return new Promise((ok,no)=>{let x=d.transaction(STORE,"readwrite");x.objectStore(STORE).delete(k);x.oncomplete=ok;x.onerror=()=>no(x.error)})}
async function library(){return(await get("library"))||[]}
async function saveLibrary(x){await set("library",x)}

async function parseAPKG(file){
 zip=await JSZip.loadAsync(file); mediaMap={};
 if(zip.file("media"))mediaMap=mediaIndex(await zip.file("media").async("uint8array"));
 let df=zip.file("collection.anki21b")||zip.file("collection.anki21")||zip.file("collection.anki2");if(!df)throw Error("دیتابیس Anki پیدا نشد");
 let SQL=await initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"+f});
 let db=new SQL.Database(zstd(await df.async("uint8array"))), decks={};
 try{let r=db.exec("select id,name from decks");if(r.length)r[0].values.forEach(x=>decks[String(x[0])]=String(x[1]).replace(/\x1f/g,"::"))}catch(e){
  try{let r=db.exec("select decks from col"),o=JSON.parse(r[0].values[0][0]);Object.keys(o).forEach(k=>decks[k]=o[k].name)}catch(_){}
 }
 let r=db.exec("select n.id,n.flds,c.did from notes n join cards c on c.nid=n.id group by n.id order by c.id");if(!r.length)throw Error("کارتی پیدا نشد");
 let cards=r[0].values.map(x=>{let f=String(x[1]).split("\x1f"),raw=f.join(" ");return{id:String(x[0]),did:String(x[2]),front:clean(f[0]),back:clean(f[1]||f[0]),sounds:sounds(raw)}});
 return{cards,decks,mediaMap};
}
function shortName(n){let p=(n||"Deck").split("::");return p[p.length-1]}
async function importFile(file){
 $("#status").textContent="در حال افزودن به کتابخانه…";
 try{
  let parsed=await parseAPKG(file), libs=await library();
  let id="d_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  let title=file.name.replace(/\.(apkg|colpkg)$/i,"").replace(/\(\+?audio\)/ig,"").trim();
  let item={id,title,fileName:file.name,total:parsed.cards.length,created:Date.now(),review:{},positions:{all:0},selected:"all",decks:parsed.decks};
  await set("blob:"+id,file); await set("cards:"+id,parsed.cards); await set("media:"+id,parsed.mediaMap);
  libs.unshift(item);await saveLibrary(libs);$("#status").textContent="";await renderLibrary();toast("به کتابخانه اضافه شد ✓");
 }catch(e){console.error(e);$("#status").textContent="خطا: "+e.message}
}
async function renderLibrary(){
 let libs=await library(),g=$("#deckGrid");g.innerHTML="";$("#libraryEmpty").style.display=libs.length?"none":"block";$("#libraryCount").textContent=libs.length?`${fa(libs.length)} مجموعه`:"";
 for(const d of libs){
  let reviewed=Object.keys(d.review||{}).length,pct=d.total?Math.round(reviewed/d.total*100):0;
  let el=document.createElement("div");el.className="deckCard";
  el.innerHTML=`<div class="deckTop"><div><div class="deckTitle">${d.title}</div><div class="deckMeta">${fa(d.total)} کارت · ${fa(Object.keys(d.decks||{}).length)} درس</div></div><div class="ring">${fa(pct)}٪</div></div><div class="miniProgress"><div style="width:${pct}%"></div></div><div class="cardActions"><button class="btn primary open">ادامه مطالعه</button><button class="btn danger remove">حذف</button></div>`;
  el.querySelector(".open").onclick=e=>{e.stopPropagation();openDeck(d.id)};el.onclick=()=>openDeck(d.id);
  el.querySelector(".remove").onclick=async e=>{e.stopPropagation();if(confirm(`«${d.title}» از کتابخانه حذف شود؟`)){let a=await library();a=a.filter(x=>x.id!==d.id);await saveLibrary(a);await del("blob:"+d.id);await del("cards:"+d.id);await del("media:"+d.id);renderLibrary()}};
  g.appendChild(el);
 }
}
async function openDeck(id){
 let libs=await library();current=libs.find(x=>x.id===id);if(!current)return;
 let blob=await get("blob:"+id);current.cards=await get("cards:"+id);mediaMap=await get("media:"+id)||{};zip=await JSZip.loadAsync(blob);
 document.body.classList.add("studying");$("#libraryView").style.display="none";$("#studyView").style.display="flex";$("#studyTitle").textContent=current.title;
 let ids=[...new Set(current.cards.map(c=>c.did))].sort((a,b)=>shortName(current.decks[a]).localeCompare(shortName(current.decks[b]),"fr",{numeric:true}));
 $("#lessonSelect").innerHTML='<option value="all">همه کارت‌ها</option>'+ids.map(x=>`<option value="${x}">${shortName(current.decks[x])}</option>`).join("");
 $("#lessonSelect").value=ids.includes(current.selected)?current.selected:"all";apply();render();
}
function apply(){let v=$("#lessonSelect").value;filtered=v==="all"?current.cards:current.cards.filter(c=>c.did===v);idx=Math.min((current.positions||{})[v]||0,Math.max(0,filtered.length-1))}
async function persist(){
 let libs=await library(),i=libs.findIndex(x=>x.id===current.id);if(i>=0){let keep={...current};delete keep.cards;libs[i]=keep;await saveLibrary(libs)}
}
function summary(){let g=0,a=0;filtered.forEach(c=>{if(current.review[c.id]==="good")g++;else if(current.review[c.id]==="again")a++});$("#goodN").textContent=fa(g);$("#againN").textContent=fa(a);$("#unseenN").textContent=fa(filtered.length-g-a)}
async function renderAudio(c){let box=$("#audio");box.innerHTML="";for(const n of c.sounds){let k=Object.keys(mediaMap).find(x=>mediaMap[x]===n);if(k!=null&&zip.file(k)){try{let b=zstd(await zip.file(k).async("uint8array")),a=document.createElement("audio");a.controls=true;a.src=URL.createObjectURL(new Blob([b],{type:mime(n)}));box.appendChild(a)}catch(e){}}}}
function render(){if(!filtered.length)return;let c=filtered[idx];$("#front").textContent=c.front||"(بدون متن)";$("#answer").textContent=c.back||"(بدون جواب)";$("#answer").style.display="none";$("#show").style.display="block";$("#count").textContent=`${fa(idx+1)} از ${fa(filtered.length)}`;$("#bar").style.width=((idx+1)/filtered.length*100)+"%";summary();renderAudio(c)}
async function mark(s){current.review[cid()]=s;let v=$("#lessonSelect").value;idx=(idx+1)%filtered.length;current.positions[v]=idx;await persist();render()}
function cid(){return filtered[idx].id}
$("#file").onchange=e=>{
  let f=e.target.files[0];
  if(f){
    if(!/\.(apkg|colpkg)$/i.test(f.name||"")){
      toast("لطفاً فایل APKG انتخاب کن");
      e.target.value="";
      return;
    }
    importFile(f);
    e.target.value="";
  }
};
$("#back").onclick=async()=>{document.body.classList.remove("studying");$("#studyView").style.display="none";$("#libraryView").style.display="block";current=null;await renderLibrary()};
$("#lessonSelect").onchange=async()=>{current.selected=$("#lessonSelect").value;apply();await persist();render()};

async function browseCard(delta){
  if(!filtered.length)return;
  idx=(idx+delta+filtered.length)%filtered.length;
  let v=$("#lessonSelect").value;
  current.positions[v]=idx;
  await persist();
  render();
}
$("#nextCard").onclick=()=>browseCard(1);
$("#prevCard").onclick=()=>browseCard(-1);

// v5.3 native-like swipe using Pointer Events.
// RIGHT = next card, LEFT = previous card.
const studyCard=$("#front").closest(".studyCard");
let dragStartX=0, dragStartY=0, dragX=0, dragging=false, horizontalDrag=false;

studyCard.addEventListener("pointerdown", e=>{
  if(e.pointerType==="mouse" && e.button!==0)return;
  dragStartX=e.clientX; dragStartY=e.clientY; dragX=0;
  dragging=true; horizontalDrag=false;
  try{studyCard.setPointerCapture(e.pointerId)}catch(_){}
});

studyCard.addEventListener("pointermove", e=>{
  if(!dragging)return;
  const dx=e.clientX-dragStartX;
  const dy=e.clientY-dragStartY;

  if(!horizontalDrag){
    if(Math.abs(dx)<8 && Math.abs(dy)<8)return;
    if(Math.abs(dx)>Math.abs(dy)*1.08) horizontalDrag=true;
    else { dragging=false; return; }
  }

  dragX=dx;
  if(e.cancelable)e.preventDefault();
  const limited=Math.max(-110,Math.min(110,dx));
  studyCard.style.transition="none";
  studyCard.style.transform=`translateX(${limited}px) rotate(${limited/45}deg)`;
  studyCard.style.opacity=String(Math.max(.72,1-Math.abs(limited)/420));
}, {passive:false});

async function finishSwipe(e){
  if(!dragging)return;
  dragging=false;
  try{studyCard.releasePointerCapture(e.pointerId)}catch(_){}
  const shouldMove=horizontalDrag && Math.abs(dragX)>=48;
  studyCard.style.transition="transform .16s ease,opacity .16s ease";

  if(shouldMove){
    const dir=dragX>0?1:-1; // right next, left previous
    studyCard.style.transform=`translateX(${dragX>0?140:-140}px)`;
    studyCard.style.opacity=".25";
    setTimeout(async()=>{
      await browseCard(dir);
      studyCard.style.transition="none";
      studyCard.style.transform=`translateX(${dragX>0?-32:32}px)`;
      studyCard.style.opacity=".55";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        studyCard.style.transition="transform .16s ease,opacity .16s ease";
        studyCard.style.transform="";
        studyCard.style.opacity="";
      }));
    },120);
  }else{
    studyCard.style.transform="";
    studyCard.style.opacity="";
  }
}
studyCard.addEventListener("pointerup",finishSwipe);
studyCard.addEventListener("pointercancel",finishSwipe);

$("#show").onclick=()=>{$("#answer").style.display="block";$("#show").style.display="none"};
$("#good").onclick=()=>mark("good");$("#again").onclick=()=>mark("again");
renderLibrary();
</script>
</body>
</html>
