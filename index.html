<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <title>فلش‌کارت من</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#0b1020;color:#fff;min-height:100vh}
    .wrap{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    h1{font-size:22px;margin:0}.muted{color:#9ca3af;font-size:13px}
    .panel{background:#121a2d;border:1px solid #25304a;border-radius:22px;padding:18px;box-shadow:0 12px 40px #0005}
    .drop{border:2px dashed #405071;border-radius:18px;padding:28px 16px;text-align:center}
    input[type=file]{display:none}
    .btn{border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}
    .primary{background:#fbbf24;color:#111827}.secondary{background:#202b44;color:#fff}.danger{background:#3b1d27;color:#fecdd3}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
    #study{display:none}
    .progress{height:7px;background:#263149;border-radius:99px;overflow:hidden;margin:14px 0 18px}
    #bar{height:100%;width:0;background:#fbbf24}
    .card{min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 18px;background:#fff;color:#111827;border-radius:24px}
    .front{font-size:25px;line-height:1.8;white-space:pre-wrap}
    .answer{display:none;margin-top:24px;padding-top:22px;border-top:1px solid #ddd;width:100%;font-size:23px;line-height:1.7;direction:ltr;white-space:pre-wrap}
    .audio{margin-top:16px;width:100%}.audio audio{width:100%}
    .stats{display:flex;justify-content:space-between;color:#aab3c5;font-size:13px;margin-bottom:10px}
    #status{margin-top:14px;line-height:1.8}.ok{color:#86efac}.err{color:#fda4af}
    .tiny{font-size:12px;color:#8d99ae;margin-top:14px}
    select{width:100%;background:#202b44;color:#fff;border:1px solid #33415e;border-radius:14px;padding:12px;margin:12px 0;font-size:15px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>فلش‌کارت من</h1><div class="muted">Anki APKG Reader برای iPhone · v3</div></div>
    <button id="reset" class="btn danger">پاک کردن</button>
  </div>

  <section id="loader" class="panel">
    <div class="drop">
      <div style="font-size:44px">🗂️</div>
      <h2>فایل Anki را انتخاب کن</h2>
      <p class="muted">فایل <b>.apkg</b> روی خود گوشی پردازش می‌شود و جایی آپلود نمی‌شود.</p>
      <label class="btn primary" for="file">انتخاب فایل APKG</label>
      <input id="file" type="file" accept=".apkg,application/zip">
      <div id="status"></div>
    </div>
  </section>

  <section id="study" class="panel">
    <div class="stats"><span id="count"></span><span id="deckName"></span></div>
    <select id="deckSelect"></select>
    <div class="progress"><div id="bar"></div></div>
    <div class="card">
      <div class="front" id="front"></div>
      <div class="answer" id="answer"></div>
      <div class="audio" id="audio"></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn secondary" id="show">نمایش جواب</button></div>
    <div class="row" style="margin-top:10px">
      <button class="btn secondary" id="again">دوباره</button>
      <button class="btn primary" id="good">بلدم ✓</button>
    </div>
    <div class="tiny">پیشرفت روی همین iPhone ذخیره می‌شود.</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js"></script>
<script>
const $=s=>document.querySelector(s);
let cards=[], filtered=[], idx=0, mediaMap={}, zip=null, db=null, deckMap={};
const td=new TextDecoder("utf-8");

function setStatus(msg, cls=""){ $("#status").className=cls; $("#status").textContent=msg; }
function clean(s){
  return (s||"")
    .replace(/\[sound:[^\]]+\]/g,"")
    .replace(/\x1f/g," ")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ")
    .replace(/&amp;/g,"&")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .trim();
}
const mediaNames=s=>[...(s||"").matchAll(/\[sound:([^\]]+)\]/g)].map(x=>x[1]);

function isZstd(u8){
  return u8 && u8.length>=4 && u8[0]===0x28 && u8[1]===0xB5 && u8[2]===0x2F && u8[3]===0xFD;
}
function maybeZstd(u8){
  if(isZstd(u8)){
    if(!window.fzstd) throw new Error("کتابخانه Zstandard بارگذاری نشد. اینترنت را بررسی کن.");
    return window.fzstd.decompress(u8);
  }
  return u8;
}
function readVarint(buf, pos){
  let val=0, shift=0, b;
  do{
    if(pos>=buf.length) throw new Error("protobuf ناقص است");
    b=buf[pos++]; val += (b & 0x7f) * Math.pow(2,shift); shift+=7;
  }while(b & 0x80);
  return [val,pos];
}
function skipField(buf,pos,wire){
  if(wire===0){ let r=readVarint(buf,pos); return r[1]; }
  if(wire===1) return pos+8;
  if(wire===2){ let r=readVarint(buf,pos); return r[1]+r[0]; }
  if(wire===5) return pos+4;
  throw new Error("wire type پشتیبانی نمی‌شود: "+wire);
}
function parseMediaEntry(msg){
  let pos=0, name=null;
  while(pos<msg.length){
    let r=readVarint(msg,pos), tag=r[0]; pos=r[1];
    let field=Math.floor(tag/8), wire=tag%8;
    if(field===1 && wire===2){
      let rr=readVarint(msg,pos), len=rr[0]; pos=rr[1];
      name=td.decode(msg.slice(pos,pos+len)); pos+=len;
    } else pos=skipField(msg,pos,wire);
  }
  return name;
}
function parseMediaProto(buf){
  let pos=0, names=[];
  while(pos<buf.length){
    let r=readVarint(buf,pos), tag=r[0]; pos=r[1];
    let field=Math.floor(tag/8), wire=tag%8;
    if(field===1 && wire===2){
      let rr=readVarint(buf,pos), len=rr[0]; pos=rr[1];
      let msg=buf.slice(pos,pos+len); pos+=len;
      let name=parseMediaEntry(msg);
      if(name) names.push(name);
    } else pos=skipField(buf,pos,wire);
  }
  return names;
}
function parseMediaIndex(raw){
  let bytes=maybeZstd(raw);
  // Old APKG: JSON object {"0":"file.mp3",...}
  try{
    let txt=td.decode(bytes).trim();
    if(txt.startsWith("{")){
      let obj=JSON.parse(txt);
      return obj;
    }
  }catch(e){}
  // New APKG: protobuf, entries are in the same order as numeric ZIP members.
  let names=parseMediaProto(bytes);
  let obj={};
  names.forEach((name,i)=>obj[String(i)]=name);
  return obj;
}
function mimeFor(name){
  let ext=(name.split(".").pop()||"").toLowerCase();
  return ({mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",wav:"audio/wav",ogg:"audio/ogg",opus:"audio/ogg",
           webp:"image/webp",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif"})[ext] || "application/octet-stream";
}

async function loadAPKG(file){
  try{
    setStatus("در حال باز کردن فایل…");
    zip=await JSZip.loadAsync(file);

    mediaMap={};
    if(zip.file("media")){
      setStatus("در حال خواندن فایل‌های صوتی…");
      const raw=await zip.file("media").async("uint8array");
      mediaMap=parseMediaIndex(raw);
    }

    // Modern Anki exports keep the real database in collection.anki21b
    // (Zstandard-compressed). collection.anki2 can be only a one-card
    // compatibility database telling old clients to update.
    let dbFile = zip.file("collection.anki21b") || zip.file("collection.anki21") || zip.file("collection.anki2");
    if(!dbFile) throw new Error("دیتابیس Anki داخل فایل پیدا نشد.");
    setStatus("در حال خواندن دیتابیس اصلی فلش‌کارت‌ها…");
    let bytes=await dbFile.async("uint8array");
    bytes=maybeZstd(bytes);

    const SQL=await initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"+f});
    db=new SQL.Database(bytes);

    let decks={};
    try{
      let col=db.exec("select decks from col")[0].values[0][0];
      decks=JSON.parse(col);
    }catch(e){}
    deckMap=decks;

    let res=db.exec("select n.id, n.flds, c.did from notes n join cards c on c.nid=n.id group by n.id order by c.id");
    if(!res.length) throw new Error("هیچ کارتی پیدا نشد.");

    cards=res[0].values.map((r,i)=>{
      let fields=String(r[1]).split("\x1f");
      let raw=fields.join(" ");
      return {
        id:String(r[0]),
        did:String(r[2]),
        front:clean(fields[0]||""),
        back:clean(fields[1]||fields[0]||""),
        sounds:mediaNames(raw)
      };
    });

    setupDecks();
    $("#loader").style.display="none";
    $("#study").style.display="block";
    restore();
    render();
  }catch(err){
    console.error(err);
    setStatus("خطا: "+err.message,"err");
  }
}

function deckName(did){
  let d=deckMap[did]||deckMap[Number(did)];
  return d && d.name ? d.name : "Deck";
}
function setupDecks(){
  let ids=[...new Set(cards.map(c=>c.did))];
  $("#deckSelect").innerHTML='<option value="all">همه کارت‌ها</option>'+
    ids.map(id=>`<option value="${id}">${deckName(id)}</option>`).join("");
  $("#deckSelect").onchange=()=>{idx=0;applyFilter();render();save()};
  applyFilter();
}
function applyFilter(){
  let v=$("#deckSelect").value;
  filtered=v==="all"?cards:cards.filter(c=>c.did===v);
  $("#deckName").textContent=v==="all"?"همه":deckName(v);
}
async function renderAudio(card){
  const box=$("#audio"); box.innerHTML="";
  for(const name of card.sounds){
    const key=Object.keys(mediaMap).find(k=>mediaMap[k]===name);
    if(key!=null && zip.file(key)){
      try{
        let raw=await zip.file(key).async("uint8array");
        let data=maybeZstd(raw);
        let blob=new Blob([data],{type:mimeFor(name)});
        let a=document.createElement("audio");
        a.controls=true; a.preload="metadata"; a.src=URL.createObjectURL(blob);
        box.appendChild(a);
      }catch(e){ console.warn("Audio error",name,e); }
    }
  }
}
function render(){
  if(!filtered.length)return;
  if(idx>=filtered.length)idx=0;
  let c=filtered[idx];
  $("#front").textContent=c.front||"(بدون متن)";
  $("#answer").textContent=c.back||"(بدون جواب)";
  $("#answer").style.display="none";
  $("#show").style.display="block";
  $("#count").textContent=`${idx+1} / ${filtered.length}`;
  $("#bar").style.width=((idx+1)/filtered.length*100)+"%";
  renderAudio(c);
}
function save(){
  localStorage.setItem("apkg-progress-v2",JSON.stringify({idx,deck:$("#deckSelect").value}));
}
function restore(){
  try{
    let p=JSON.parse(localStorage.getItem("apkg-progress-v2"));
    if(p){
      $("#deckSelect").value=p.deck||"all";
      applyFilter();
      idx=Math.min(p.idx||0,Math.max(0,filtered.length-1));
    }
  }catch(e){}
}
$("#file").onchange=e=>{let f=e.target.files[0]; if(f)loadAPKG(f)};
$("#show").onclick=()=>{$("#answer").style.display="block";$("#show").style.display="none"};
$("#good").onclick=()=>{idx=(idx+1)%filtered.length;save();render()};
$("#again").onclick=()=>{idx=(idx+1)%filtered.length;save();render()};
$("#reset").onclick=()=>{localStorage.removeItem("apkg-progress-v2");location.reload()};
</script>
</body>
</html>
