<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <title>فلش‌کارت من</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#0b1020;color:#fff;min-height:100vh}
    .wrap{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    h1{font-size:22px;margin:0}.muted{color:#9ca3af;font-size:13px}
    .panel{background:#121a2d;border:1px solid #25304a;border-radius:22px;padding:18px;box-shadow:0 12px 40px #0005}
    .drop{border:2px dashed #405071;border-radius:18px;padding:28px 16px;text-align:center}
    input[type=file]{display:none}.btn{border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}
    .primary{background:#fbbf24;color:#111827}.secondary{background:#202b44;color:#fff}.danger{background:#3b1d27;color:#fecdd3}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
    #study{display:none}.progress{height:7px;background:#263149;border-radius:99px;overflow:hidden;margin:14px 0 18px}
    #bar{height:100%;width:0;background:#fbbf24}.card{min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 18px;background:#fff;color:#111827;border-radius:24px}
    .front{font-size:25px;line-height:1.8}.answer{display:none;margin-top:24px;padding-top:22px;border-top:1px solid #ddd;width:100%;font-size:23px;line-height:1.7;direction:ltr}
    .audio{margin-top:16px}.stats{display:flex;justify-content:space-between;color:#aab3c5;font-size:13px;margin-bottom:10px}
    #status{margin-top:12px;line-height:1.7}.tiny{font-size:12px;color:#8d99ae;margin-top:14px}
    select{width:100%;background:#202b44;color:#fff;border:1px solid #33415e;border-radius:14px;padding:12px;margin:12px 0;font-size:15px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>فلش‌کارت من</h1><div class="muted">Anki APKG Reader برای iPhone</div></div><button id="reset" class="btn danger">پاک کردن</button></div>

  <section id="loader" class="panel">
    <div class="drop">
      <div style="font-size:44px">🗂️</div>
      <h2>فایل Anki را انتخاب کن</h2>
      <p class="muted">فایل <b>.apkg</b> روی خود گوشی پردازش می‌شود و جایی آپلود نمی‌شود.</p>
      <label class="btn primary" for="file">انتخاب فایل APKG</label>
      <input id="file" type="file" accept=".apkg,application/zip">
      <div id="status"></div>
    </div>
  </section>

  <section id="study" class="panel">
    <div class="stats"><span id="count"></span><span id="deckName"></span></div>
    <select id="deckSelect"></select>
    <div class="progress"><div id="bar"></div></div>
    <div class="card" id="card">
      <div class="front" id="front"></div>
      <div class="answer" id="answer"></div>
      <div class="audio" id="audio"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn secondary" id="show">نمایش جواب</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn secondary" id="again">دوباره</button>
      <button class="btn primary" id="good">بلدم ✓</button>
    </div>
    <div class="tiny">پیشرفت روی همین iPhone ذخیره می‌شود.</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const $=s=>document.querySelector(s);
let cards=[], filtered=[], idx=0, media={}, zip=null, db=null, deckMap={};
const clean=s=>(s||"").replace(/\x1f/g," ").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&");
const mediaNames=s=>[...(s||"").matchAll(/\[sound:([^\]]+)\]/g)].map(x=>x[1]);

async function loadAPKG(file){
  $("#status").textContent="در حال باز کردن فایل…";
  zip=await JSZip.loadAsync(file);
  if(zip.file("media")) media=JSON.parse(await zip.file("media").async("text"));
  let dbFile=zip.file("collection.anki2");
  if(!dbFile) throw new Error("collection.anki2 پیدا نشد.");
  let bytes=await dbFile.async("uint8array");
  const SQL=await initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"+f});
  db=new SQL.Database(bytes);

  let decks={};
  try{
    let col=db.exec("select decks from col")[0].values[0][0];
    decks=JSON.parse(col);
  }catch(e){}
  deckMap=decks;

  let res=db.exec("select n.flds, c.did from notes n join cards c on c.nid=n.id group by n.id order by c.id");
  if(!res.length) throw new Error("هیچ کارتی پیدا نشد.");
  cards=res[0].values.map((r,i)=>{
    let fields=String(r[0]).split("\x1f");
    let raw=fields.join(" ");
    return {id:i, did:String(r[1]), front:clean(fields[0]||""), back:clean(fields[1]||fields[0]||""), sounds:mediaNames(raw)};
  });
  setupDecks();
  $("#loader").style.display="none"; $("#study").style.display="block";
  restore(); render();
}

function deckName(did){
  let d=deckMap[did]||deckMap[Number(did)];
  return d && d.name ? d.name : "همه کارت‌ها";
}
function setupDecks(){
  let ids=[...new Set(cards.map(c=>c.did))];
  $("#deckSelect").innerHTML='<option value="all">همه کارت‌ها</option>'+ids.map(id=>`<option value="${id}">${deckName(id)}</option>`).join("");
  $("#deckSelect").onchange=()=>{idx=0;applyFilter();render();save()};
  applyFilter();
}
function applyFilter(){
  let v=$("#deckSelect").value;
  filtered=v==="all"?cards:cards.filter(c=>c.did===v);
  $("#deckName").textContent=v==="all"?"همه":deckName(v);
}
function render(){
  if(!filtered.length)return;
  if(idx>=filtered.length)idx=0;
  let c=filtered[idx];
  $("#front").textContent=c.front||"(بدون متن)";
  $("#answer").textContent=c.back||"(بدون جواب)";
  $("#answer").style.display="none";
  $("#show").style.display="block";
  $("#count").textContent=`${idx+1} / ${filtered.length}`;
  $("#bar").style.width=((idx+1)/filtered.length*100)+"%";
  $("#audio").innerHTML="";
  c.sounds.forEach(async name=>{
    let key=Object.keys(media).find(k=>media[k]===name);
    if(key && zip.file(key)){
      let blob=await zip.file(key).async("blob");
      let a=document.createElement("audio"); a.controls=true; a.src=URL.createObjectURL(blob);
      $("#audio").appendChild(a);
    }
  });
}
function save(){localStorage.setItem("apkg-progress",JSON.stringify({idx,deck:$("#deckSelect").value}))}
function restore(){try{let p=JSON.parse(localStorage.getItem("apkg-progress"));if(p){$("#deckSelect").value=p.deck||"all";applyFilter();idx=Math.min(p.idx||0,Math.max(0,filtered.length-1));}}catch(e){}}
$("#file").onchange=e=>{let f=e.target.files[0]; if(f)loadAPKG(f).catch(err=>$("#status").textContent="خطا: "+err.message)};
$("#show").onclick=()=>{$("#answer").style.display="block";$("#show").style.display="none"};
$("#good").onclick=()=>{idx=(idx+1)%filtered.length;save();render()};
$("#again").onclick=()=>{idx=(idx+1)%filtered.length;save();render()};
$("#reset").onclick=()=>{localStorage.removeItem("apkg-progress");location.reload()};
</script>
</body>
</html>
